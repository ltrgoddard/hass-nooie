name: "Nooie"
slug: nooie
description: "Stream your Nooie cameras into Home Assistant (WebRTC to RTSP via go2rtc)."
version: "0.1.0"
arch:
  - amd64
  - aarch64
init: false
startup: application
ingress: true
ingress_port: 1984
panel_icon: "mdi:cctv"
ports:
  1984/tcp: null
  8554/tcp: null
  8555/tcp: null
ports_description:
  1984/tcp: "go2rtc API and web UI (optional)"
  8554/tcp: "RTSP for external consumers such as Frigate (optional)"
  8555/tcp: "WebRTC for browsers (optional)"
options:
  username: ""
  password: ""
  country_code: "44"
  devices: []
schema:
  username: str
  password: password
  country_code: "int(1,999)"
  devices:
    - id: str
      name: str
url: "https://github.com/ltrgoddard/nooie-proxy"
